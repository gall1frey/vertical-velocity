<!-- 
 
Uses ROSbridge to subscribe to the /vertical_velocity topic and
plots it over time using highcharts

This is a standalone HTML file, however it uses a python server
due to CORS requirements

Author: Mallika Sirdeshpande
Date: 2026-04-29
Updated: 2026-04-30
-->

<!DOCTYPE html>
    <head>
        <meta charset="utf-8" />
        <title>ROV vertical speed visualizer</title>
        <!-- ROS CDNs -->
        <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/eventemitter2@6.4.9/lib/eventemitter2.min.js"></script>
        <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/roslib@1/build/roslib.min.js"></script>
        
        <!-- UPlot CDN and CSS -->
        <link rel="stylesheet" href="https://unpkg.com/uplot/dist/uPlot.min.css">
        <script type="text/javascript" src="https://unpkg.com/uplot/dist/uPlot.iife.min.js"></script>

        <!-- Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300..700&family=Fira+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

        <style>
            html {
                width: 100vw;
            }
            body {
                font-family: "Fira Sans", sans-serif;
                font-weight: 400;
                font-style: normal;
                margin: auto;
            }
            .title {
                margin: auto;
                width: 70%;
                height: 100%;
                display: flex;
                justify-content: center;
                align-items: center;
            }
            .plot {
                display: flex;
                flex-direction: column;
                justify-content: center;
                margin: auto;
            }
        </style>
    </head>


    <body>
        <div class="title">
            <h1>Vertical Speed</h1>
        </div>

        <!-- Plots Divs -->
        <div class="plot">
            <div class="plot" id="vspeed"></div>
            <div class="plot" id="depth"></div>
        </div>
        
        <script type="text/javascript">
            
            // ROSBridge connection
            // Reference: https://wiki.ros.org/roslibjs/Tutorials/BasicRosFunctionality
            var ros = new ROSLIB.Ros({
                url: 'ws://localhost:9090'
            });

            const MAX_POINTS = 1000;

            let depthX = [];
            let depthY = [];

            let vspeedX = [];
            let vspeedY = [];

            function createPlot(el, title) {
                return new uPlot({
                    width: 800,
                    height: 300,
                    title: title,
                    scales: {
                        x: {
                            time: false
                        }
                    },
                    axes: [
                        {
                            label: "Samples"
                        },
                        {
                            label: title
                        }
                    ],
                    series: [
                        {},
                        {
                            stroke: "#32CD32",
                            width: 2
                        }
                    ]
                }, [[], []], document.getElementById(el));
            }

            const depthPlot = createPlot("depth", "Depth");
            const vspeedPlot = createPlot("vspeed", "Vertical Velocity");


            const depth_listener = new ROSLIB.Topic({
                ros: ros,
                name: '/depth',
                messageType: 'std_msgs/Float32'
            });

            const vspeed_listener = new ROSLIB.Topic({
                ros: ros,
                name: '/vertical_velocity',
                messageType: 'std_msgs/Float32'
            });


            function push(plot, xs, ys, x, y) {
                xs.push(x);
                ys.push(y);

                if (xs.length > MAX_POINTS) {
                    xs.shift();
                    ys.shift();
                }
            }

            let depthIndex = 0;
            let vspeedIndex = 0;

            depth_listener.subscribe(msg => {
                push(depthPlot, depthX, depthY, depthIndex++, msg.data);
            });

            vspeed_listener.subscribe(msg => {
                push(vspeedPlot, vspeedX, vspeedY, vspeedIndex++, msg.data);
                console.log("Vertical Velocity: ",msg.data);
            });

            setInterval(() => {
                depthPlot.setData([depthX, depthY]);
                vspeedPlot.setData([vspeedX, vspeedY]);
            }, 50); 

        </script>
    </body>
</html>
